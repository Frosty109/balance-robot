name: CI

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build
      - run: cmake --build build
      - run: cd build && ctest --output-on-failure

  build-firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Linux is case-sensitive: this job is what catches header-case regressions
      # (e.g. #include "MPU6050.h") that pass silently on case-insensitive macOS.
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'
      - run: cmake -B build-fw -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi-gcc.cmake
      - run: cmake --build build-fw
